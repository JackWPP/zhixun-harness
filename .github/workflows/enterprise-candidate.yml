name: enterprise candidate checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      BASELINE_CPU_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the declared runtime and test dependencies
        run: python -m pip install '.[dev,agent]'
      - name: Candidate regression suite
        run: python -m pytest -q
      - name: SDK offline contracts
        working-directory: vendor/contest_harness-1.0.5
        run: python -m unittest tests.test_sdk tests.test_contract_regressions tests.test_transport_regressions
